[package]
name = "farm-core"
description = "Farm 宿主核心：tokio runtime、共享 AppState、SQLite 私有存储（rusqlite + WAL）与版本化顺序 migration runner、内存事件总线原语。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
farm-sdk = { path = "../farm-sdk" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
rusqlite.workspace = true
getrandom.workspace = true
time.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

# fake pi RPC 测试替身（ticket #16）：说文档化 1.0.2 wire protocol 的 JSONL 进程。
# 集成测试经 `CARGO_BIN_EXE_fake-pi` 拿到它的绝对路径。
[[bin]]
name = "fake-pi"
path = "src/bin/fake-pi.rs"

# fake nw Warehouse CLI 测试替身（ticket #17 凭据过路财神）：`nw key get` 说 JSON envelope。
# 集成测试经 `CARGO_BIN_EXE_fake-nw` 拿到它的绝对路径。
[[bin]]
name = "fake-nw"
path = "src/bin/fake-nw.rs"
